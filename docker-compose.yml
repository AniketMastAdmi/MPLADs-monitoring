version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mplads_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mplads_insight.db
      - API_PORT=8000
    volumes:
      - ./data:/app/data
      - ./mplads_insight.db:/app/mplads_insight.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mplads_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
